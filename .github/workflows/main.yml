name: React-build

on:
  push:
    branches: ['main']

jobs:
  react-build-vite:
    runs-on: ubuntu-latest

    concurrency:
      group: react-build-${{ github.ref }}
      cancel-in-progress: true
      
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Setup node js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install dependences
        run: npm install
      - name: Build App
        run: npm run build

      - name: upload build on artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build-files
          path: dist/
      - name: Print finaly message
        run: echo "Final Done"

      
